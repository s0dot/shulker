[project]
name = "shulker"
version = "0.1.0"
description = "Local bricks of snow."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
	"duckdb>=1.5.4",
	"pyarrow>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shulker"]
